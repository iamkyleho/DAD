<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a16">
  <meta name="description" content="우리 아빠를 위한 작은 마법. 케이크를 누르면 생일 파티가 시작됩니다.">
  <title>우리 아빠, 생신 축하드려요 🎂</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎂%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="audio.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="ambience" aria-hidden="true"><div class="warmth"></div><div class="spotlight"></div><div class="floor-light"></div><div class="bokeh"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <main>
    <button class="cake-button" id="cake-button" aria-label="우리 아빠 생신 축하하기. 케이크를 누르면 폭죽과 생일 축하 노래가 나와요. 다시 누르면 처음부터, Escape를 누르면 멈춰요.">
      <span class="cake-motion">
        <span class="cake" id="cake">
          <span class="candle-halo" aria-hidden="true"></span>
          <img src="assets/cake.svg" alt="" width="600" height="500" draggable="false" fetchpriority="high">
          <span class="candles" aria-hidden="true">
            <span class="candle candle-one"><i class="wick"></i><i class="flame"><i></i></i><i class="smoke"></i></span>
            <span class="candle candle-two"><i class="wick"></i><i class="flame"><i></i></i><i class="smoke"></i></span>
            <span class="candle candle-three"><i class="wick"></i><i class="flame"><i></i></i><i class="smoke"></i></span>
          </span>
        </span>
      </span>
    </button>
    <p class="screen-reader-only" id="status" role="status" aria-live="polite"></p>
    <p class="audio-error" id="audio-error" role="alert" hidden>소리를 켜지 못했어요. 케이크를 한 번 더 눌러 주세요.</p>
  </main>
  <canvas id="confetti" aria-hidden="true"></canvas>
</body>
</html>
